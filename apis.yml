name: Nuvocargo
description: 'Nuvocargo is an AI-powered freight-management platform for North American
  truckload logistics, focused on the US-Mexico-Canada cross-border corridor. Its
  "Nuvo AI" system coordinates a network of specialized agents (quoting, negotiation,
  booking, dispatch, tracking, exception handling, audit, and payment) to automate
  the freight load lifecycle, and it pairs that software with licensed freight
  brokerage, managed transportation, and customs-brokerage services. The company was
  surfaced through the API Evangelist network as a portfolio company of Homebrew and
  QED Investors. As of this enrichment pass Nuvocargo publishes no public developer
  API, OpenAPI specification, or developer portal; onboarding is contact-gated
  ("zero-integration" pilots), so this profile captures the company identity,
  legal/resource surface, and domain-security posture rather than API artifacts.'
